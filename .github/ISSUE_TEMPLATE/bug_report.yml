name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include sensitive paths or files. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version
    validations:
      required: true
